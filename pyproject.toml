[project]
name = "slidr"
version = "1.3.0-beta"
description = "A Python pipeline for processing Slide-Tag spatial transcriptomics data with Cellranger, Cellbender, and custom analyses"
authors = [
    {name = "Daniel Kabanovsky"}
]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.11,<3.15"
dependencies = [
    "python-dotenv>=1.2.1,<2.0.0",
    "gspread>=6.2.1,<7.0.0",
    "datetime>=6.0,<7.0",
    "pandas<3",
    "dotenv>=0.9.9,<0.10.0",
    "pathlib>=1.0.1,<2.0.0",
    "google>=3.0.0,<4.0.0",
    "pyyaml>=6.0.3,<7.0.0",
    "numpy<2",
    "google-auth>=2.49.1",
    "nvidia-ml-py>=13.595.45",
    "rich>=15.0.0",
    "slack-sdk>=3.42.0",
    "playwright>=1.61.0",
    "h5py>=3.16.0",
]
